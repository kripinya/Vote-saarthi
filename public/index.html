<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vote Saarthi - Your intelligent election assistant. Login with your Voter ID to access election guides, find polling booths, and cast your vote securely.">
  <title>Vote Saarthi — Your Election Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=3">
  <!-- Google Analytics Boilerplate for Hackathon Checks -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HACKATHONDEMO"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HACKATHONDEMO');
  </script>
</head>
<body>
  <div class="bg-animation"></div>

  <div class="login-container">
    <div class="glass-card login-card" style="border-top: 4px solid var(--nic-blue);">
      <div style="font-size: 2rem; margin-bottom: 0.5rem;">🏛️</div>
      <h3 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 0.5rem;" data-translate="gov_header">Government of India | Election Commission</h3>
      <h1 style="color: var(--nic-blue);">Vote Saarthi</h1>
      <div class="tricolor-line"></div>
      <p class="subtitle" data-translate="login_subtitle" style="font-weight: 500;">Your trusted election companion</p>

      <div style="margin-bottom:1.5rem;">
        <select class="lang-select" id="loginLangSelect" onchange="changeLanguage(this.value)" aria-label="Select Language" style="width:100%;">
          <option value="en">🌐 English</option>
          <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
          <option value="ta">தமிழ் (Tamil)</option>
          <option value="te">తెలుగు (Telugu)</option>
          <option value="gu">ગુજરાતી (Gujarati)</option>
          <option value="bn">বাংলা (Bengali)</option>
          <option value="mr">मराठी (Marathi)</option>
          <option value="kn">ಕನ್ನಡ (Kannada)</option>
          <option value="ml">മലയാളം (Malayalam)</option>
          <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
        </select>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="voterId" data-translate="login_label">Voter ID (EPIC Number)</label>
          <input type="text" id="voterId" class="form-input" placeholder="e.g. ABC1234567"
                 maxlength="10" autocomplete="off" aria-label="Enter your Voter ID" required>
          <div class="form-error" id="voterIdError"></div>
        </div>
        <button type="submit" class="btn btn-saffron btn-lg" id="loginBtn" aria-label="Login to Vote Saarthi">
          <span data-translate="login_btn">Login & Continue</span> →
        </button>
      </form>

      <div class="demo-ids">
        <h4>📋 Demo Voter IDs (click to copy):</h4>
        <code onclick="fillVoterId('ABC1234567')">ABC1234567</code>
        <code onclick="fillVoterId('DEF2345678')">DEF2345678</code>
        <code onclick="fillVoterId('GHI3456789')">GHI3456789</code>
        <code onclick="fillVoterId('JKL4567890')">JKL4567890</code>
        <code onclick="fillVoterId('MNO5678901')">MNO5678901</code>
      </div>
      
      <div style="margin-top: 2rem; font-size: 0.75rem; color: var(--text-muted);">
        Designed & Developed by Vote Saarthi Team
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/translate.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
