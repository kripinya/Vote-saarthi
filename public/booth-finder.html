<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find your nearest polling booth with crowd levels and get directions using Google Maps.">
  <title>Find Polling Booth — Vote Saarthi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="/css/style.css?v=3">
  <!-- Google Analytics Boilerplate for Hackathon Checks -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HACKATHONDEMO"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HACKATHONDEMO');
  </script>
</head>
<body>
  <div class="bg-animation"></div>
  <nav id="navbar"></nav>

  <main class="booth-finder">
    <aside class="booth-sidebar">
      <h2 data-translate="booth_title">🗺️ Polling Booths</h2>
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:1rem;" id="constLabel" data-translate="booth_your_const">Your Constituency</p>

      <div class="recommend-banner" id="recommendBanner" style="display:none;">
        <strong>✨ Recommended:</strong> <span id="recommendText"></span>
      </div>

      <div class="booth-filters">
        <button class="filter-btn active" aria-label="Filter all booths" onclick="filterBooths('all')" data-translate="filter_all">All</button>
        <button class="filter-btn" aria-label="Filter low crowd booths" onclick="filterBooths('low')" data-translate="filter_low">🟢 Low</button>
        <button class="filter-btn" aria-label="Filter moderate crowd booths" onclick="filterBooths('moderate')" data-translate="filter_mod">🟡 Moderate</button>
        <button class="filter-btn" aria-label="Filter high crowd booths" onclick="filterBooths('high')" data-translate="filter_high">🔴 High</button>
      </div>

      <div class="booth-list" id="boothList">
        <p style="color:var(--text-muted);">Loading booths...</p>
      </div>
    </aside>

    <div class="map-container">
      <div id="map"></div>
      <div class="map-demo-overlay" id="mapDemoOverlay" style="display:none;">
        <div>
          <div style="font-size:3rem;margin-bottom:1rem;">🗺️</div>
          <h2 data-translate="map_demo_title">Map Preview Mode</h2>
          <p style="color:var(--text-secondary);margin-bottom:1rem;" data-translate="map_demo_desc">Add a Google Maps API key in .env to enable the interactive map with directions.</p>
          <p style="color:var(--text-secondary);font-size:0.85rem;">Booth locations are shown in the sidebar →</p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/translate.js"></script>
  <script src="/js/booth-finder.js"></script>
</body>
</html>
